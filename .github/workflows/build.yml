name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ScreenRecorderSingleTab.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenRecorderSingleTab-apk
          path: ScreenRecorderSingleTab.apk

      - name: Publish as a GitHub release (direct download link)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ScreenRecorderSingleTab.apk \
            --title "Screen Recorder Single Tab" \
            --notes "Latest build. Download ScreenRecorderSingleTab.apk and install it."
